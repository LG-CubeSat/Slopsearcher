services:
  slopsearcher:
    build: .
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/slopsearcher.db
      GOOGLE_TOKEN_PATH: /data/google-token.json
      SLOP_CODEX_HOME: /data/codex
      CODEX_HOME: /data/codex
      CODEX_BIN: codex
    volumes:
      - ./data:/data
    # Discord Gateway and all API traffic are outbound. No ports are published.
